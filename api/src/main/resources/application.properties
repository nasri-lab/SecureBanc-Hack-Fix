server.port=8080

# Base H2 en mémoire, en mode de compatibilité PostgreSQL.
#   DATABASE_TO_LOWER : noms de colonnes en minuscules dans les réponses JSON (ex. GET /api/cards)
#   DB_CLOSE_DELAY=-1 : la base vit tant que l'API tourne ; un redémarrage de l'API repart d'une base neuve.
spring.datasource.url=${DB_URL:jdbc:h2:mem:securebank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:securebank}
spring.datasource.password=${DB_PASSWORD:securebank}
spring.sql.init.mode=always

securebank.jwt.secret=${JWT_SECRET:securebank-lab-secret-key-0123456789abcdef}
securebank.fraud.url=${FRAUD_URL:http://localhost:8081}

# --- Gestion des erreurs ---
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-binding-errors=always

# --- Actuator ---
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
management.endpoint.env.show-values=ALWAYS
